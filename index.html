<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COPERTO — ресторан и кинотеатр</title>
<style>
  :root {
    --olive: #9ca13f;
    --olive-light: #b8bd5e;
    --bg: #0e0f0c;
    --bg2: #15170f;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    color: #f3f2ea;
    background:
      radial-gradient(1200px 700px at 50% -10%, rgba(156,161,63,.18), transparent 60%),
      radial-gradient(900px 600px at 50% 120%, rgba(156,161,63,.10), transparent 60%),
      linear-gradient(160deg, var(--bg), var(--bg2));
    background-attachment: fixed;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px;
    overflow: hidden;
    position: relative;
  }
  /* мягкое «зерно» / виньетка */
  body::after {
    content: "";
    position: fixed; inset: 0;
    background: radial-gradient(120% 120% at 50% 50%, transparent 55%, rgba(0,0,0,.55));
    pointer-events: none;
  }
  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 680px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 48px;
    animation: rise .9s cubic-bezier(.2,.7,.2,1) both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .logo {
    width: min(78%, 460px);
    height: auto;
    filter: drop-shadow(0 8px 40px rgba(156,161,63,.25));
  }
  .tagline {
    font-size: clamp(13px, 2.2vw, 16px);
    letter-spacing: .42em;
    text-transform: uppercase;
    color: var(--olive-light);
    font-weight: 500;
    margin-top: -16px;
  }
  .buttons {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    justify-content: center;
    width: 100%;
  }
  .btn {
    --c: var(--olive);
    flex: 1 1 220px;
    max-width: 280px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 18px 28px;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: .03em;
    text-decoration: none;
    cursor: pointer;
    transition: transform .25s cubic-bezier(.2,.7,.2,1), box-shadow .25s, background .25s, color .25s;
  }
  .btn svg { width: 22px; height: 22px; flex: 0 0 auto; }
  .btn-primary {
    background: linear-gradient(135deg, var(--olive), var(--olive-light));
    color: #14160d;
    box-shadow: 0 12px 30px rgba(156,161,63,.35);
  }
  .btn-primary:hover {
    transform: translateY(-3px);
    box-shadow: 0 18px 40px rgba(156,161,63,.5);
  }
  .btn-ghost {
    background: rgba(255,255,255,.04);
    color: #f3f2ea;
    border: 1.5px solid rgba(156,161,63,.55);
    backdrop-filter: blur(4px);
  }
  .btn-ghost:hover {
    transform: translateY(-3px);
    background: rgba(156,161,63,.14);
    border-color: var(--olive-light);
  }
  .footer {
    font-size: 12.5px;
    letter-spacing: .25em;
    text-transform: uppercase;
    color: rgba(243,242,234,.35);
  }
  @media (max-width: 520px) {
    .card { gap: 36px; }
    .btn { flex: 1 1 100%; max-width: 360px; }
  }
</style>
</head>
